# SigNoz stack — include this file only when ENABLE_SIGNOZ=true
# (wizard enable_signoz). Omitting this file is how ENABLE_SIGNOZ=false
# keeps SigNoz containers from starting. Uses the shared ClickHouse
# on aiops-net and writes signoz_* databases, not a second ClickHouse.
#
# OTLP ports are NOT published: ingestion stays on our otel-collector.
# signoz-otel-collector listens internally on 4317 for the fan-out copy.

volumes:
  signoz_sqlite:

services:
  signoz-schema-migrator:
    image: signoz/signoz-schema-migrator:0.111.24
    command:
      - sync
      - --dsn=tcp://clickhouse:9000
      - --dev
      - --up=
    networks:
      - aiops-net
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  # Async migrator from SigNoz v0.71; --dev skips cluster/replication so we
  # can reuse the shared ClickHouse on aiops-net instead of a second instance.
  signoz-schema-migrator-async:
    image: signoz/signoz-schema-migrator:0.111.24
    command:
      - async
      - --dsn=tcp://clickhouse:9000
      - --dev
      - --up=
    networks:
      - aiops-net
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    restart: on-failure

  signoz-query-service:
    image: signoz/query-service:0.71.0
    command:
      - --config=/root/config/prometheus.yml
      - --use-logs-new-schema=true
      - --use-trace-new-schema=true
    volumes:
      - ./config/signoz/prometheus.yml:/root/config/prometheus.yml:ro
      - signoz_sqlite:/var/lib/signoz/
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    expose:
      - "8080"
    networks:
      - aiops-net
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  signoz-frontend:
    image: signoz/frontend:0.71.0
    volumes:
      - ./config/signoz/nginx-config.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SIGNOZ_PORT:-8080}:3301"
    networks:
      - aiops-net
    depends_on:
      signoz-query-service:
        condition: service_healthy
    restart: unless-stopped

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.111.26
    command:
      - --config=/etc/otel-collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./config/signoz-otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    expose:
      - "4317"
      - "4318"
    networks:
      - aiops-net
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully
      signoz-query-service:
        condition: service_healthy
    restart: unless-stopped
